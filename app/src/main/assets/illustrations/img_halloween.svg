<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Tło z zaokrąglonymi rogami i miękkim cieniem -->
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FDD835" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="48" fill="url(#cardGrad)" />
  
  <!-- Główny okrąg ekspozycyjny obiektu -->
  <circle cx="300" cy="270" r="190" fill="#FDD835" opacity="0.15" />
  <circle cx="300" cy="270" r="160" fill="#FDD835" opacity="0.25" />
  <circle cx="300" cy="270" r="130" fill="#FFFFFF" filter="url(#softShadow)" />

  <!-- Dziecięcy motyw wizualny obiektu edukacyjnego -->
  <text x="300" y="325" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="140" fill="#F57F17" text-anchor="middle">H</text>

  <!-- Wstęga z etykietą kategorii i nazwą -->
  <rect x="75" y="470" width="450" height="76" rx="38" fill="#FDD835" />
  <text x="300" y="520" font-family="'Nunito', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">HALLOWEEN</text>
</svg>